<!DOCTYPE html>
<!--
  ============================================================
  SHO-SAN スロット  ―  Step 1.5：絵柄を画像対応＋枠素材対応
  ============================================================
  このファイル1つで動きます（HTML / CSS / JavaScript 同梱）。

  ▼ 画像素材の置き方（このフォルダ内に images/ を作って入れてください）
     slot/images/frame.png … 窓枠（SHO-SAN）素材   ※あれば自動で枠に適用されます
     slot/images/sym1.png  … 絵柄1（いちばん高得点）
     slot/images/sym2.png  … 絵柄2
     slot/images/sym3.png  … 絵柄3
     slot/images/sym4.png  … 絵柄4
     slot/images/sym5.png  … 絵柄5（追加予定）
     slot/images/sym6.png  … 絵柄6（追加予定）
  ※ 画像がまだ無くても、絵柄名の文字でちゃんと遊べます（フォールバック）。
  ※ frame.png を入れると、自動で窓枠デザインに切り替わります。
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHO-SAN スロット</title>
<style>
  :root{
    --gold:#f4c430;
    --gold-dark:#b8860b;
    --red:#c01722;
    --red-dark:#7a0d14;
    --bg1:#1a0406;
    --bg2:#3a0a0f;
    --cell:#fffdf5;
    --cellH:92px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:#fff;
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:22px 14px 48px;
  }
  h1{ font-size:1.7rem; letter-spacing:.06em; margin-bottom:2px; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  h1 span{ color:var(--gold); }
  .subtitle{ font-size:.78rem; opacity:.6; margin-bottom:18px; }

  /* ===== スコア ===== */
  .scoreboard{ display:flex; gap:14px; margin-bottom:16px; }
  .score-box{
    background:rgba(0,0,0,.35); border:1px solid var(--gold-dark);
    border-radius:14px; padding:9px 22px; text-align:center; min-width:120px;
  }
  .score-box .label{ font-size:.68rem; opacity:.7; letter-spacing:.1em; }
  .score-box .value{ font-size:1.7rem; font-weight:bold; color:var(--gold); font-variant-numeric:tabular-nums; }

  /* ===== スロット本体（デフォルト：CSSで描いた枠。frame.pngがあれば差し替え） ===== */
  .machine{
    position:relative;
    background:linear-gradient(145deg,#5a0f15,#2a060a);
    border:6px solid var(--gold);
    border-radius:24px; padding:18px;
    box-shadow:0 0 0 4px var(--gold-dark), 0 18px 40px rgba(0,0,0,.6);
  }
  .window{ display:flex; gap:10px; background:#120203; padding:10px; border-radius:14px; }
  .reel{
    position:relative; width:92px; height:calc(var(--cellH) * 3);
    overflow:hidden; border-radius:10px; background:var(--cell);
  }
  .strip{ position:absolute; top:0; left:0; width:100%; will-change:transform; }
  .cell{
    height:var(--cellH); display:flex; align-items:center; justify-content:center;
    font-size:3rem; border-bottom:1px solid #eee; user-select:none; overflow:hidden;
  }
  .cell .sym{ width:84%; height:84%; object-fit:contain; }
  /* 画像読み込み失敗時：絵柄名の文字を表示 */
  .cell.noimg::after{
    content:attr(data-label); font-size:.95rem; font-weight:bold;
    color:var(--red-dark); text-align:center; line-height:1.2; padding:4px;
  }
  .payline{
    position:absolute; left:18px; right:18px; top:50%; transform:translateY(-50%);
    height:var(--cellH); border:3px solid rgba(244,196,48,.35); border-radius:10px; pointer-events:none;
  }
  .cell.win{ animation:flash .5s ease-in-out 0s 6 alternate; border-radius:8px; }
  @keyframes flash{
    from{ background:transparent; }
    to{ background:rgba(244,196,48,.65); box-shadow:0 0 18px rgba(244,196,48,.9) inset; }
  }

  /* ===== frame.png がある場合：窓枠画像に重ねる ===== */
  body.has-frame h1, body.has-frame .subtitle{ display:none; }
  body.has-frame .machine{
    background:url("images/frame.png") center/contain no-repeat;
    border:none; box-shadow:none; padding:0;
    width:min(900px,97vw); aspect-ratio:1512/1000;
  }
  body.has-frame .payline{ display:none; }
  /* 枠の3つの白窓に合わせてリールを重ねる（位置は微調整可能） */
  body.has-frame .window{
    position:absolute; left:21.3%; top:27.3%; width:57.6%; height:36.8%;
    background:transparent; padding:0; border-radius:0; gap:0; justify-content:space-between;
  }
  body.has-frame .reel{ width:30.5%; height:100%; border-radius:0; }

  /* ===== 操作 ===== */
  .controls{ margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .spin-btn{
    background:linear-gradient(180deg,var(--gold),var(--gold-dark));
    color:#3a2600; font-weight:bold; font-size:1.3rem; letter-spacing:.12em;
    border:none; border-radius:999px; padding:16px 60px; cursor:pointer;
    box-shadow:0 6px 0 #7c5a06, 0 10px 20px rgba(0,0,0,.4);
    transition:transform .08s, box-shadow .08s;
  }
  .spin-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #7c5a06; }
  .spin-btn:disabled{ filter:grayscale(.6) brightness(.8); cursor:not-allowed; }
  .message{
    min-height:1.6em; font-size:1.05rem; font-weight:bold; text-align:center;
    color:var(--gold); text-shadow:0 1px 4px rgba(0,0,0,.6);
  }

  .paytable{
    margin-top:24px; background:rgba(0,0,0,.3); border:1px solid var(--gold-dark);
    border-radius:14px; padding:14px 18px; font-size:.82rem; max-width:360px; width:100%;
  }
  .paytable h2{ font-size:.82rem; opacity:.8; margin-bottom:8px; letter-spacing:.06em; }
  .paytable ul{ list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; }
  .paytable li{ display:flex; justify-content:space-between; }
  .paytable .pt{ color:var(--gold); font-weight:bold; }
</style>
</head>
<body>

  <h1>SHO-SAN <span>スロット</span></h1>
  <p class="subtitle">Step 1：横・斜めでそろえてポイントGET</p>

  <div class="scoreboard">
    <div class="score-box"><div class="label">TOTAL POINT</div><div class="value" id="totalPoint">0</div></div>
    <div class="score-box"><div class="label">SPINS</div><div class="value" id="spinCount">0</div></div>
  </div>

  <div class="machine">
    <div class="window" id="window"></div>
    <div class="payline"></div>
  </div>

  <div class="controls">
    <button class="spin-btn" id="spinBtn">S P I N</button>
    <div class="message" id="message">ボタンを押して回してね！</div>
  </div>

  <div class="paytable">
    <h2>絵柄と配点（3つそろうと加算）</h2>
    <ul id="paytableList"></ul>
  </div>

<script>
/* ============================================================
   設定エリア
   ============================================================ */
// 添付順＝ポイントが高い順。img はファイル名、label は画像が無いときの表示文字
const SYMBOLS = [
  { id:'s1', img:'sym1.png', label:'Claude',  point:500, weight:1 }, // 1番目＝最高得点
  { id:'s2', img:'sym2.png', label:'Gemini',  point:300, weight:2 },
  { id:'s3', img:'sym3.png', label:'ChatGPT', point:200, weight:3 },
  { id:'s4', img:'sym4.png', label:'Notion',  point:120, weight:4 },
  { id:'s5', img:'sym5.png', label:'絵柄5',   point:70,  weight:6 }, // 追加予定
  { id:'s6', img:'sym6.png', label:'絵柄6',   point:40,  weight:8 }, // 追加予定
];

const REEL_COUNT = 3;
const ROW_COUNT  = 3;

/* ============================================================
   仕組み
   ============================================================ */
let CELL_H = 92;
let totalPoint = 0, spinCount = 0, spinning = false;

const weightedPool = [];
SYMBOLS.forEach(s => { for(let i=0;i<s.weight;i++) weightedPool.push(s); });
const pickRandomSymbol = () => weightedPool[Math.floor(Math.random()*weightedPool.length)];
const symbolById = id => SYMBOLS.find(s => s.id === id);

const windowEl  = document.getElementById('window');
const spinBtn   = document.getElementById('spinBtn');
const messageEl = document.getElementById('message');
const totalEl   = document.getElementById('totalPoint');
const spinEl    = document.getElementById('spinCount');

const reels = [];

// 配点早見表
document.getElementById('paytableList').innerHTML = SYMBOLS
  .map(s => `<li><span>${s.label}</span><span class="pt">${s.point}pt</span></li>`)
  .join('');

// 1マスのHTML（画像＋失敗時フォールバック）
function cellHTML(s){
  return `<div class="cell" data-label="${s.label}">`
       + `<img class="sym" src="images/${s.img}" alt="${s.label}" `
       + `onerror="this.parentNode.classList.add('noimg');this.remove();"></div>`;
}
function renderStrip(strip, symbolList, offset){
  strip.innerHTML = symbolList.map(cellHTML).join('');
  strip.style.transition = 'none';
  strip.style.transform = `translateY(${-offset*CELL_H}px)`;
}

function buildReels(){
  for(let r=0; r<REEL_COUNT; r++){
    const reel = document.createElement('div');
    reel.className = 'reel';
    const strip = document.createElement('div');
    strip.className = 'strip';
    reel.appendChild(strip);
    windowEl.appendChild(reel);
    const initial = [pickRandomSymbol(), pickRandomSymbol(), pickRandomSymbol()];
    reels.push({ el:reel, strip, result: initial.map(s=>s.id) });
  }
  applyCellHeight();
}

// マスの高さを状況に合わせて決める（枠画像モードでは窓の高さに自動フィット）
function applyCellHeight(){
  const reel = reels[0] && reels[0].el;
  if(document.body.classList.contains('has-frame') && reel){
    CELL_H = Math.max(40, Math.round(reel.clientHeight / ROW_COUNT));
  } else {
    CELL_H = 92;
  }
  document.documentElement.style.setProperty('--cellH', CELL_H + 'px');
  // 現在の表示を引き直す
  reels.forEach(r => renderStrip(r.strip, r.result.map(symbolById), 0));
}

function spinReel(reel, finalThree, durationMs){
  return new Promise(resolve => {
    const strip = reel.strip;
    const filler = [];
    const FILL = 24;
    for(let i=0;i<FILL;i++) filler.push(pickRandomSymbol());
    const fullList = [...filler, ...finalThree];
    renderStrip(strip, fullList, 0);
    void strip.offsetHeight;
    const finalOffset = fullList.length - ROW_COUNT;
    strip.style.transition = `transform ${durationMs}ms cubic-bezier(.15,.85,.25,1)`;
    strip.style.transform = `translateY(${-finalOffset*CELL_H}px)`;
    reel.result = finalThree.map(s=>s.id);
    const onEnd = () => { strip.removeEventListener('transitionend', onEnd); resolve(); };
    strip.addEventListener('transitionend', onEnd);
  });
}

async function spin(){
  if(spinning) return;
  spinning = true; spinBtn.disabled = true;
  messageEl.textContent = '回転中…';
  clearWinHighlight();
  spinCount++; spinEl.textContent = spinCount;

  const reelResults = reels.map(() =>
    [pickRandomSymbol(), pickRandomSymbol(), pickRandomSymbol()]);

  await Promise.all(reels.map((reel, i) =>
    spinReel(reel, reelResults[i], 1400 + i*450)));

  evaluate();
  spinning = false; spinBtn.disabled = false;
}

function evaluate(){
  const grid = [];
  for(let row=0; row<ROW_COUNT; row++){
    grid[row] = reels.map(reel => reel.result[row]);
  }
  const lines = [
    { name:'上段',   cells:[[0,0],[0,1],[0,2]] },
    { name:'中段',   cells:[[1,0],[1,1],[1,2]] },
    { name:'下段',   cells:[[2,0],[2,1],[2,2]] },
    { name:'斜め＼', cells:[[0,0],[1,1],[2,2]] },
    { name:'斜め／', cells:[[2,0],[1,1],[0,2]] },
  ];
  let gained = 0; const winningCells = []; const hitNames = [];
  lines.forEach(line => {
    const ids = line.cells.map(([r,c]) => grid[r][c]);
    if(ids[0] === ids[1] && ids[1] === ids[2]){
      const sym = symbolById(ids[0]);
      gained += sym.point;
      hitNames.push(`${line.name}:${sym.label}`);
      winningCells.push(...line.cells);
    }
  });
  if(gained > 0){
    totalPoint += gained; totalEl.textContent = totalPoint;
    messageEl.textContent = `🎉 ${hitNames.join('  ')}  ＋${gained}pt！`;
    highlightWin(winningCells);
  } else {
    messageEl.textContent = 'ざんねん！もう一回！';
  }
}

function highlightWin(cells){
  cells.forEach(([row, col]) => {
    const allCells = reels[col].strip.querySelectorAll('.cell');
    const startIndex = allCells.length - ROW_COUNT;
    const target = allCells[startIndex + row];
    if(target) target.classList.add('win');
  });
}
function clearWinHighlight(){
  document.querySelectorAll('.cell.win').forEach(c => c.classList.remove('win'));
}

// frame.png があれば窓枠モードに切り替え
const frameTest = new Image();
frameTest.onload = () => { document.body.classList.add('has-frame'); applyCellHeight(); };
frameTest.src = 'images/frame.png';

window.addEventListener('resize', applyCellHeight);
buildReels();
spinBtn.addEventListener('click', spin);
</script>
</body>
</html>
